services:
  postgres:
    image: postgres:15-alpine
    container_name: devstore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: devstore_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devstore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devstore_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/devstore_db?schema=public
      JWT_SECRET: super-secret-jwt-key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devstore_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: